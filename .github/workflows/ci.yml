name: MegaMart Microservices CI

on:
  push:
    branches:
      - Test

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # ============================================================
  # BUILD + TEST + SECURITY + DOCKER + ECR
  # ============================================================

  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:

          # ====================================================
          # BACKEND MICROSERVICES
          # ====================================================

          - service: auth-service
            path: megamart/services/auth-service
            type: backend

          - service: user-service
            path: megamart/services/user-service
            type: backend

          - service: product-service
            path: megamart/services/product-service
            type: backend

          - service: catalog-service
            path: megamart/services/catalog-service
            type: backend

          - service: inventory-service
            path: megamart/services/inventory-service
            type: backend

          - service: cart-service
            path: megamart/services/cart-service
            type: backend

          - service: order-service
            path: megamart/services/order-service
            type: backend

          - service: payment-service
            path: megamart/services/payment-service
            type: backend

          - service: shipping-service
            path: megamart/services/shipping-service
            type: backend

          - service: notification-service
            path: megamart/services/notification-service
            type: backend

          - service: review-service
            path: megamart/services/review-service
            type: backend

          - service: rating-service
            path: megamart/services/rating-service
            type: backend

          - service: search-service
            path: megamart/services/search-service
            type: backend

          - service: recommendation-service
            path: megamart/services/recommendation-service
            type: backend

          - service: pricing-service
            path: megamart/services/pricing-service
            type: backend

          - service: promotion-service
            path: megamart/services/promotion-service
            type: backend

          - service: wishlist-service
            path: megamart/services/wishlist-service
            type: backend

          - service: address-service
            path: megamart/services/address-service
            type: backend

          - service: checkout-service
            path: megamart/services/checkout-service
            type: backend

          - service: api-gateway
            path: megamart/services/api-gateway
            type: backend

          - service: admin-service
            path: megamart/services/admin-service
            type: backend

          - service: media-service
            path: megamart/services/media-service
            type: backend

          - service: analytics-service
            path: megamart/services/analytics-service
            type: backend

          - service: fraud-service
            path: megamart/services/fraud-service
            type: backend

          # ====================================================
          # FRONTEND
          # ====================================================

          - service: frontend
            path: megamart/frontend
            type: frontend

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================

      - name: Checkout source code
        uses: actions/checkout@v7


      # ========================================================
      # 2. DISPLAY SERVICE INFORMATION
      # ========================================================

      - name: Display service information
        run: |
          echo "=========================================="
          echo "MegaMart CI"
          echo "=========================================="
          echo "Service : ${{ matrix.service }}"
          echo "Type    : ${{ matrix.type }}"
          echo "Path    : ${{ matrix.path }}"
          echo "Commit  : ${{ github.sha }}"
          echo "Branch  : ${{ github.ref_name }}"
          echo "Event   : ${{ github.event_name }}"
          echo "=========================================="


      # ========================================================
      # 3. VERIFY PROJECT FILES
      # ========================================================

      - name: Verify project files
        run: |
          echo "=========================================="
          echo "Checking ${{ matrix.service }}"
          echo "=========================================="

          echo "Repository root:"
          pwd

          echo ""
          echo "Service path:"
          echo "${{ matrix.path }}"

          if [ ! -d "${{ matrix.path }}" ]; then
            echo "ERROR: Directory does not exist:"
            echo "${{ matrix.path }}"
            exit 1
          fi

          echo ""
          echo "Directory exists:"
          ls -la "${{ matrix.path }}"

          echo ""
          echo "Checking package.json..."

          if [ ! -f "${{ matrix.path }}/package.json" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          echo "package.json found"

          echo ""
          echo "Checking package-lock.json..."

          if [ ! -f "${{ matrix.path }}/package-lock.json" ]; then
            echo "ERROR: package-lock.json not found"
            echo ""
            echo "Generate it locally:"
            echo "cd ${{ matrix.path }}"
            echo "npm install"
            exit 1
          fi

          echo "package-lock.json found"

          echo ""
          echo "Checking Dockerfile..."

          if [ ! -f "${{ matrix.path }}/Dockerfile" ]; then
            echo "ERROR: Dockerfile not found"
            exit 1
          fi

          echo "Dockerfile found"

          echo ""
          echo "All required files found"


      # ========================================================
      # 4. SETUP NODE.JS
      # ========================================================

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json


      # ========================================================
      # 5. NODE/NPM VERSION
      # ========================================================

      - name: Display Node.js versions
        run: |
          echo "Node:"
          node --version

          echo "NPM:"
          npm --version


      # ========================================================
      # 6. INSTALL DEPENDENCIES
      # ========================================================

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: npm ci


      # ========================================================
      # 7. BACKEND TESTS
      # ========================================================

      - name: Run backend unit tests
        if: matrix.type == 'backend'
        working-directory: ${{ matrix.path }}
        run: npm test


      # ========================================================
      # 8. FRONTEND BUILD
      # ========================================================

      - name: Build frontend
        if: matrix.type == 'frontend'
        working-directory: ${{ matrix.path }}
        run: npm run build


      # ========================================================
      # 9. NPM SECURITY AUDIT
      # ========================================================

      - name: Dependency security audit
        working-directory: ${{ matrix.path }}
        run: npm audit --audit-level=high


      # ========================================================
      # 10. INSTALL TRIVY
      # ========================================================

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.68.2
          cache: true


      # ========================================================
      # 11. TRIVY FILESYSTEM SCAN
      # ========================================================

      - name: Trivy filesystem scan
        working-directory: ${{ matrix.path }}
        run: |
          trivy fs \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            .


      # ========================================================
      # 12. BUILD DOCKER IMAGE
      # ========================================================

      - name: Build Docker image
        working-directory: ${{ matrix.path }}
        run: |
          docker build \
            -t megamart/${{ matrix.service }}:${{ github.sha }} \
            .


      # ========================================================
      # 13. DISPLAY DOCKER IMAGE
      # ========================================================

      - name: Display Docker image
        run: |
          docker images megamart/${{ matrix.service }}


      # ========================================================
      # 14. TRIVY IMAGE SCAN
      # ========================================================

      - name: Trivy Docker image scan
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            megamart/${{ matrix.service }}:${{ github.sha }}


      # ========================================================
      # AWS / ECR
      #
      # Only runs when code is PUSHED to Test.
      # Pull requests do not push images.
      # ========================================================


      # ========================================================
      # 15. CONFIGURE AWS CREDENTIALS
      # ========================================================

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ========================================================
      # 16. VERIFY AWS IDENTITY
      # ========================================================

      - name: Verify AWS identity
        if: github.event_name == 'push'
        run: |
          aws sts get-caller-identity


      # ========================================================
      # 17. LOGIN TO ECR
      # ========================================================

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ========================================================
      # 18. VERIFY ECR REPOSITORY
      # ========================================================

      - name: Verify ECR repository
        if: github.event_name == 'push'
        run: |
          echo "Checking ECR repository:"
          echo "${{ matrix.service }}"

          aws ecr describe-repositories \
            --repository-names "${{ matrix.service }}" \
            --region "${{ env.AWS_REGION }}"


      # ========================================================
      # 19. TAG IMAGE WITH COMMIT SHA
      # ========================================================

      - name: Tag Docker image for ECR
        if: github.event_name == 'push'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag \
            megamart/${{ matrix.service }}:${{ github.sha }} \
            ${ECR_REGISTRY}/${{ matrix.service }}:${{ github.sha }}


      # ========================================================
      # 20. PUSH COMMIT SHA IMAGE
      # ========================================================

      - name: Push commit image to ECR
        if: github.event_name == 'push'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push \
            ${ECR_REGISTRY}/${{ matrix.service }}:${{ github.sha }}


      # ========================================================
      # 21. TAG IMAGE AS LATEST
      # ========================================================

      - name: Tag image as latest
        if: github.event_name == 'push'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag \
            megamart/${{ matrix.service }}:${{ github.sha }} \
            ${ECR_REGISTRY}/${{ matrix.service }}:latest


      # ========================================================
      # 22. PUSH LATEST IMAGE
      # ========================================================

      - name: Push latest image
        if: github.event_name == 'push'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push \
            ${ECR_REGISTRY}/${{ matrix.service }}:latest


      # ========================================================
      # 23. BUILD SUMMARY
      # ========================================================

      - name: Build summary
        if: always()
        run: |
          echo "=========================================="
          echo "MegaMart CI Summary"
          echo "=========================================="
          echo "Service : ${{ matrix.service }}"
          echo "Type    : ${{ matrix.type }}"
          echo "Path    : ${{ matrix.path }}"
          echo "Commit  : ${{ github.sha }}"
          echo "Event   : ${{ github.event_name }}"
          echo "=========================================="

          if [ "${{ github.event_name }}" = "push" ]; then
            echo "AWS/ECR steps enabled"
          else
            echo "Pull request: AWS/ECR push skipped"
          fi

          echo "=========================================="