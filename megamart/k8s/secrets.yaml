apiVersion: v1
kind: Secret

metadata:
  name: megamart-secrets
  namespace: megamart

  labels:
    app.kubernetes.io/name: megamart-secrets
    app.kubernetes.io/part-of: megamart

type: Opaque

stringData:

  # PostgreSQL
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "CHANGE_ME_POSTGRES_PASSWORD"

  # RabbitMQ
  RABBITMQ_USER: "megamart"
  RABBITMQ_PASSWORD: "CHANGE_ME_RABBITMQ_PASSWORD"

  # Authentication
  JWT_SECRET: "CHANGE_ME_JWT_SECRET"

  # Internal service-to-service authentication
  INTERNAL_SERVICE_TOKEN: "CHANGE_ME_INTERNAL_SERVICE_TOKEN"