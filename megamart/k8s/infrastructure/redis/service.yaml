apiVersion: v1
kind: Service

metadata:
  name: redis
  namespace: megamart

  labels:
    app: redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: megamart

spec:
  type: ClusterIP

  selector:
    app: redis

  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: redis