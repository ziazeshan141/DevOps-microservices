apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  namespace: megamart

spec:
  replicas: 1

  selector:
    matchLabels:
      app: recommendation-service

  template:
    metadata:
      labels:
        app: recommendation-service

    spec:
      containers:
        - name: recommendation-service
          image: 047385030300.dkr.ecr.us-east-1.amazonaws.com/recommendation-service:latest

          ports:
            - name: http
              containerPort: 3014

          envFrom:
            - configMapRef:
                name: megamart-config
            - secretRef:
                name: megamart-secrets

          env:
            - name: PORT
              value: "3014"

            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:3003"

            - name: RATING_SERVICE_URL
              value: "http://rating-service:3012"

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
