apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: megamart

spec:
  replicas: 1

  selector:
    matchLabels:
      app: search-service

  template:
    metadata:
      labels:
        app: search-service

    spec:
      containers:
        - name: search-service
          image: 047385030300.dkr.ecr.us-east-1.amazonaws.com/search-service:latest

          ports:
            - name: http
              containerPort: 3013

          envFrom:
            - configMapRef:
                name: megamart-config
            - secretRef:
                name: megamart-secrets

          env:
            - name: PORT
              value: "3013"

            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:3003"

            - name: REDIS_URL
              value: "redis://redis:6379"

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
