apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: megamart

spec:
  replicas: 1

  selector:
    matchLabels:
      app: notification-service

  template:
    metadata:
      labels:
        app: notification-service

    spec:
      containers:
        - name: notification-service
          image: AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/notification-service:latest

          ports:
            - name: http
              containerPort: 3010

          envFrom:
            - configMapRef:
                name: megamart-config
            - secretRef:
                name: megamart-secrets

          env:
            - name: PORT
              value: "3010"

            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: megamart-secrets
                  key: RABBITMQ_USER

            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: megamart-secrets
                  key: RABBITMQ_PASSWORD

            - name: RABBITMQ_URL
              value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672"

            - name: EVENT_EXCHANGE
              value: "megamart.events"

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10